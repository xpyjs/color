name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24 for npm Trusted Publishing
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Determine npm tag
        id: npm_tag
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if echo "$TAG_NAME" | grep -qE '(alpha|beta|rc)'; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # npm Trusted Publisher: xpyjs/color, release.yml, Allow npm publish.
      - name: Publish to npm via OIDC
        run: npm publish "$(ls xpyjs-color-*.tgz)" --access public --tag ${{ steps.npm_tag.outputs.tag }}

      - name: Verify published prerelease on jsDelivr
        if: steps.npm_tag.outputs.prerelease == 'true'
        run: |
          npm ci
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5; do
            if npm run test:package -- --runtime-only --tarball "$(ls xpyjs-color-*.tgz)" --cdn-version "$version"; then
              exit 0
            fi
            sleep 30
          done
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.npm_tag.outputs.prerelease == 'true' }}
